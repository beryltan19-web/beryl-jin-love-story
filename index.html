<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beryl × Jin — Our Love Story</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071b4a;color:#fff;font-family:Nunito,sans-serif}body{overflow-x:hidden}.screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 18% 18%,#ff8bd5 0,#f45abb 16%,#4a86f7 48%,#1d4fb7 72%,#071b4a 100%);animation:fade .35s ease}.card{width:min(920px,100%);min-height:calc(100vh - 44px);border:4px solid #fff;border-radius:24px;padding:28px;box-shadow:0 0 0 6px #ff69c6,0 0 28px #58a6ff88,0 20px 60px #00143bcc;background:linear-gradient(145deg,#123d8ef2,#42235ff2);display:flex;flex-direction:column;justify-content:center;text-align:center}.pixel{font-family:'Press Start 2P',monospace;line-height:1.8}.title{font-size:clamp(26px,6vw,54px);margin:12px 0;color:#ffd8f1;text-shadow:4px 4px #2864d8,0 0 14px #ff6ec7}.subtitle{color:#dbe9ff;font-weight:700}.players,.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0}.player,.panel{padding:18px 24px;border:3px solid #fff;border-radius:16px;background:linear-gradient(135deg,#1c58bd,#a43e9f);min-width:220px}.panel{max-width:700px;margin:18px auto;text-align:left}button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:15px 24px;background:#ff5fb7;color:#fff;cursor:pointer;box-shadow:0 5px 0 #a12d79;margin:6px}button.secondary{background:#3c7df0;box-shadow:0 5px 0 #20489b}.nav{display:flex;justify-content:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:2px solid #74a6f4}.timeline{display:grid;gap:12px;margin:26px 0;text-align:left}.memory{padding:16px;border:2px solid #ff8bd1;border-radius:16px;background:linear-gradient(135deg,#15448f,#4c2867)}.date{font-family:'Press Start 2P';font-size:11px;color:#ffc7e8}.letter{font-size:18px;line-height:1.8;text-align:left;background:linear-gradient(145deg,#123d84,#4b2866);border:2px solid #ff8bd1;border-radius:18px;padding:22px}.small{font-size:13px;color:#dbe9ff;margin-top:20px}.emoji{font-size:64px;margin:12px}.slideshow{position:relative;width:min(650px,100%);margin:24px auto 10px;border:3px solid #fff;border-radius:20px;overflow:hidden;background:#071331;box-shadow:0 0 0 5px #ff65bd,0 0 22px #4b9cff}.slideimg{width:100%;height:min(62vh,620px);object-fit:cover;display:block;cursor:zoom-in}.slidefade{animation:fade .35s ease}.slideoverlay{position:absolute;inset:0;background:linear-gradient(transparent 48%,#071331e8 100%);pointer-events:none}.slidebadge{position:absolute;top:14px;left:14px;background:#103a88df;border:2px solid #ffb6df;border-radius:999px;padding:8px 11px;font-family:'Press Start 2P';font-size:8px}.slidecaption{position:absolute;left:18px;right:18px;bottom:18px;text-align:left;pointer-events:none}.slidecaption .unlock{font-family:'Press Start 2P';font-size:9px;color:#ffb9df}.slidecaption h2{margin:8px 0 0;font-size:clamp(22px,5vw,34px)}.slidecontrols{display:flex;align-items:center;justify-content:center;gap:10px}.slidecontrols button{font-size:20px;padding:10px 18px}.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px auto;max-width:400px}.dot{width:7px;height:7px;border-radius:50%;background:#70a5ed}.dot.on{background:#ff5fb7;box-shadow:0 0 10px #ff5fb7}.photohelp{font-size:12px;color:#dbe9ff;margin:8px auto 18px;max-width:650px}.lightbox{position:fixed;inset:0;z-index:9999;background:#02091aee;display:none;align-items:center;justify-content:center;padding:18px}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 6px #ff69c6,0 0 35px #58a6ff}.lightbox-close{position:fixed;right:18px;top:18px;z-index:10000;background:#ff5fb7;border:2px solid #fff;border-radius:999px;width:46px;height:46px;padding:0;font-size:22px;line-height:42px}.progresswrap{position:fixed;left:12px;right:12px;top:10px;z-index:40;display:flex;align-items:center;gap:8px}.progresslabel{font-family:'Press Start 2P';font-size:8px;white-space:nowrap}.progress{height:12px;flex:1;background:#0a173d;border:2px solid #fff;border-radius:999px;overflow:hidden}.progressbar{height:100%;background:linear-gradient(90deg,#ff5fb7,#66a3ff);width:5%;transition:.35s}.quizq{font-size:20px;font-weight:900;margin:18px 0}.choice{min-width:220px}.choice.correct{background:#2eb872}.choice.wrong{background:#d94b66}.codeinput{font-family:'Press Start 2P';font-size:18px;text-align:center;padding:16px;border-radius:12px;border:3px solid #fff;background:#0d2458;color:#fff;width:min(320px,90%);outline:none}.msg{min-height:28px;font-weight:900;color:#ffd0eb}.bossarena{position:relative;min-height:220px;border:3px dashed #ff9ed8;border-radius:20px;margin:24px auto;padding:28px;max-width:680px;overflow:hidden}.runaway{position:absolute;left:58%;top:58%;transition:.12s}.gift{font-size:90px;cursor:pointer;filter:drop-shadow(0 0 15px #ff6ec7);animation:bob 1.2s infinite alternate}.rewardbox{display:none;margin:18px auto;padding:24px;border:3px solid #fff;border-radius:20px;background:linear-gradient(135deg,#ff5fb755,#3c7df055)}.rewardbox.show{display:block;animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}@media(max-width:600px){.card{padding:18px}.slideimg{height:55vh}.progresslabel{display:none}.runaway{left:52%;top:62%}}</style></head><body><div class="progresswrap"><div class="progresslabel">LOVE LEVEL</div><div class="progress"><div id="progressbar" class="progressbar"></div></div></div><div id="app"></div><div id="lightbox" class="lightbox" onclick="closeLightbox(event)"><button class="lightbox-close" onclick="closeLightbox(event)">✕</button><img id="lightboxImg" alt="Expanded memory photo"></div><script>
const memories=[['03/04','🌱','First time we met'],['08/04','🎬','First private-space movie'],['11/04','🇲🇾','First JB trip'],['12/04','🎬','First JB movie date'],['20/04','🌧️','First drive in the heavy rain + first photo you took of me'],['24/04','🚗','First time picking you up from MBS Zara + our second movie'],['01/05','🎂','First birthday I celebrated for you'],['15/05','🥢','First dim sum supper'],['12/07','🎂🏨','First birthday you celebrated for me + first staycation for my birthday'],['24/07','❤️','Our official date'],['24/08','🎉','Our first monthsary'],['EVERYDAY','🚗','Endless fetching from work to home, school to dates'],['BONUS','🦁','First zoo • Second zoo with my precious godsons • First beach']];
const photos=[['photos/beryl-jin-photos-renamed/photo01.jpeg','😂','Silly Us'],['photos/beryl-jin-photos-renamed/photo02.jpeg','🪞','Little Dates With You'],['photos/beryl-jin-photos-renamed/photo03.jpeg','👣','Footprints Together'],['photos/beryl-jin-photos-renamed/photo04.jpeg','🥢','Dim Sum Date'],['photos/beryl-jin-photos-renamed/photo05.jpeg','🚲','Cycling Adventure'],['photos/beryl-jin-photos-renamed/photo06.jpeg','🌊','Beach Night ❤️'],['photos/beryl-jin-photos-renamed/photo07.jpeg','☕','Cafe Date'],['photos/beryl-jin-photos-renamed/photo08.jpeg','💋','A Little Kiss'],['photos/beryl-jin-photos-renamed/photo09.jpeg','🛍️','Shopping Together'],['photos/beryl-jin-photos-renamed/photo10.jpeg','🍜','Eat Eat Eat'],['photos/beryl-jin-photos-renamed/photo11.gif','🧸','Photo Booth Fun'],['photos/beryl-jin-photos-renamed/photo12.jpeg','🪞','Red Light Mirror Moment'],['photos/beryl-jin-photos-renamed/photo13.jpeg','🚗','Late Night Drives'],['photos/beryl-jin-photos-renamed/photo14.jpg','🎂','Birthday Memory'],['photos/beryl-jin-photos-renamed/photo15.jpg','💐','Birthday Together'],['photos/beryl-jin-photos-renamed/photo16.jpg','🎈','Birthday Surprise'],['photos/beryl-jin-photos-renamed/photo17.jpg','🍽️','Food Adventures'],['photos/beryl-jin-photos-renamed/photo18.jpg','🌙','Beachside Us'],['photos/beryl-jin-photos-renamed/photo19.jpg','🎞️','Hana Film Memories'],['photos/beryl-jin-photos-renamed/photo20.jpg','🍳','Another Food Date'],['photos/beryl-jin-photos-renamed/photo21.JPG','🎮','Life4Cuts Arcade'],['photos/beryl-jin-photos-renamed/photo22.JPG','🎞️','Hana Film Memories II'],['photos/beryl-jin-photos-renamed/photo23.jpg','🤣','Goofier Us']];
const quiz=[{q:'When did we first meet?',a:['03/04','24/07','24/08'],c:0},{q:'When did we become official?',a:['12/07','24/07','03/04'],c:1},{q:'What do we always end up doing together?',a:['Studying only','Eating, movies & shopping','Running marathons'],c:1},{q:'What are we celebrating?',a:['Our first monthsary','One year','Graduation'],c:0}];
let slide=0,timer,qi=0,score=0;
const progress={home:5,memories:20,complete:30,quiz:45,secret:60,letter:72,boss:84,reward:94,finish:100};
function memoryHTML(){return memories.map(m=>`<div class="memory"><div class="date">${m[0]}</div><h3>${m[1]} ${m[2]}</h3></div>`).join('')}
function home(){return `<div class="screen"><main class="card"><div class="pixel">BERYL × JIN</div><div class="title">OUR LOVE STORY ❤️</div><p class="subtitle">PLAYER 1: BERYL • PLAYER 2: JIN</p><div class="players"><div class="player">🎮 PLAYER 1<br><strong>BERYL</strong></div><div class="player">💗 PLAYER 2<br><strong>JIN</strong></div></div><button onclick="go('memories')">PRESS START ❤️</button><p class="small">A little arcade game made from our memories.</p></main></div>`}
function memoriesPage(){return `<div class="screen"><main class="card"><div class="pixel">LEVEL 1 — OUR MEMORIES</div><div class="title">MEMORY UNLOCKED ✨</div><p class="subtitle">Collecting our favourite moments, one level at a time.</p><div class="slideshow"><img id="slideimg" class="slideimg" src="${photos[0][0]}" onclick="openLightbox()" title="Click to expand"><div class="slideoverlay"></div><div class="slidebadge" id="slidecount">MEMORY 01 / ${photos.length}</div><div class="slidecaption"><div class="unlock" id="unlock">${photos[0][1]} MEMORY UNLOCKED</div><h2 id="slidetitle">${photos[0][2]}</h2><b>+1 MEMORY ❤️</b></div></div><div class="photohelp">🔍 CLICK PHOTO TO EXPAND • AUTO PLAY 4 SEC</div><div class="slidecontrols"><button class="secondary" onclick="moveSlide(-1)">←</button><button onclick="moveSlide(1)">→</button></div><div class="dots" id="dots">${photos.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('')}</div><div class="timeline">${memoryHTML()}</div><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button onclick="go('complete')">🏆 LEVEL COMPLETE →</button></div></main></div>`}
function complete(){return `<div class="screen"><main class="card"><div class="emoji">🏆</div><div class="pixel">LEVEL 1 COMPLETED</div><div class="title">ALL MEMORIES UNLOCKED</div><p class="subtitle">${photos.length}/${photos.length} MEMORIES COLLECTED ❤️</p><button onclick="startQuiz()">🧠 NEXT LEVEL: COUPLE QUIZ</button><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button class="secondary" onclick="go('memories')">🔙 BACK</button></div></main></div>`}
function quizPage(){let x=quiz[qi];return `<div class="screen"><main class="card"><div class="pixel">LEVEL 2 — COUPLE QUIZ</div><div class="title">HOW WELL DO YOU KNOW US? 🧠</div><p class="subtitle">QUESTION ${qi+1} / ${quiz.length} • LOVE POINTS ${score}</p><div class="panel"><div class="quizq">${x.q}</div><div class="choices">${x.a.map((a,i)=>`<button class="choice secondary" onclick="answerQuiz(${i},this)">${a}</button>`).join('')}</div><div id="quizmsg" class="msg"></div></div></main></div>`}
function secret(){return `<div class="screen"><main class="card"><div class="pixel">🔐 SECRET LEVEL DETECTED</div><div class="title">ENTER THE SECRET DATE</div><p class="subtitle">Hint: the day we officially became us ❤️</p><div class="emoji">🔒</div><input id="code" class="codeinput" placeholder="DD/MM" inputmode="numeric"><div><button onclick="checkCode()">UNLOCK ❤️</button></div><div id="codemsg" class="msg"></div><div class="nav"><button class="secondary" onclick="go('quiz')">🔙 BACK</button></div></main></div>`}
function letter(){return `<div class="screen"><main class="card"><div class="pixel">LEVEL 3 — HEART MESSAGE</div><div class="title">💌 A LETTER FROM BERYL</div><div class="letter"><p><strong>Happy 1st Monthsary, Bb ❤️</strong></p><p>These are only some of our firsts. From our first meeting, our little movie dates and JB adventures, to birthdays, staycays, food, beaches, zoo days and all those endless rides from work to home and school to dates — every little moment became part of our story.</p><p>Thank you for all the memories, the laughter and the ordinary days that somehow became special because they were with you.</p><p>And this is only Level 1 of us. I can't wait to collect many, many more memories with you. 🥹❤️</p></div><button onclick="go('boss')">⚔️ CONTINUE TO FINAL BOSS</button><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button></div></main></div>`}
function boss(){return `<div class="screen"><main class="card"><div class="pixel">FINAL BOSS ⚔️</div><div class="title">ONE LAST QUESTION...</div><p class="subtitle">Will you continue collecting memories with Beryl? ❤️</p><div class="bossarena" id="bossarena"><button onclick="go('reward')">💗 YES, ALWAYS</button><button id="nobtn" class="secondary runaway" onmouseenter="runAway()" ontouchstart="runAway()" onclick="runAway()">😈 NO</button></div><p class="small">Choose carefully, Player Jin 🎮</p></main></div>`}
function reward(){return `<div class="screen"><main class="card"><div class="pixel">BONUS REWARD UNLOCKED 🎁</div><div class="title">MYSTERY GIFT</div><p class="subtitle">Tap the gift to claim your reward.</p><div class="gift" onclick="openGift()">🎁</div><div id="rewardbox" class="rewardbox"><div class="emoji">💞</div><div class="pixel">REWARD CLAIMED!</div><h2>Unlimited hugs, kisses, food dates, late-night drives & adventures with Beryl ♾️❤️</h2><button onclick="go('finish')">🏆 CLAIM & FINISH</button></div></main></div>`}
function finish(){return `<div class="screen"><main class="card"><div class="emoji">🏆💗</div><div class="pixel">ACHIEVEMENT UNLOCKED</div><div class="title">JIN CHOSE BERYL ❤️</div><p class="subtitle">LOVE LEVEL: 100%</p><h2>ONE MONTH OF US</h2><p>More food. More movies. More shopping. More adventures. More us.</p><p class="pixel">TO BE CONTINUED... ♾️</p><button onclick="go('home')">🏠 PLAY AGAIN</button></main></div>`}
function updateSlide(){let p=photos[slide],im=document.getElementById('slideimg');if(!im)return;im.classList.remove('slidefade');void im.offsetWidth;im.classList.add('slidefade');im.src=p[0];document.getElementById('slidecount').textContent=`MEMORY ${String(slide+1).padStart(2,'0')} / ${photos.length}`;document.getElementById('unlock').textContent=p[1]+' MEMORY UNLOCKED';document.getElementById('slidetitle').textContent=p[2];document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===slide))}
function moveSlide(n){slide=(slide+n+photos.length)%photos.length;updateSlide();startSlides()}function startSlides(){clearInterval(timer);timer=setInterval(()=>{slide=(slide+1)%photos.length;updateSlide()},4000)}
function openLightbox(){clearInterval(timer);document.getElementById('lightboxImg').src=photos[slide][0];document.getElementById('lightbox').classList.add('show');document.body.style.overflow='hidden'}function closeLightbox(e){if(e)e.stopPropagation();document.getElementById('lightbox').classList.remove('show');document.body.style.overflow='';if(location.hash==='#memories')startSlides()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
function startQuiz(){qi=0;score=0;go('quiz')}function answerQuiz(i,btn){let correct=quiz[qi].c,all=document.querySelectorAll('.choice');all.forEach(b=>b.disabled=true);if(i===correct){btn.classList.remove('secondary');btn.classList.add('correct');score++;document.getElementById('quizmsg').textContent='CORRECT! +1 LOVE POINT ❤️'}else{btn.classList.remove('secondary');btn.classList.add('wrong');all[correct].classList.add('correct');document.getElementById('quizmsg').textContent='Oops 😂 but I still love you.'}setTimeout(()=>{qi++;if(qi>=quiz.length)go('secret');else render('quiz')},900)}
function checkCode(){let v=(document.getElementById('code').value||'').replace(/\s/g,'');let ok=['24/07','24-07','2407','24.07'].includes(v);let m=document.getElementById('codemsg');if(ok){m.textContent='ACCESS GRANTED ❤️ SECRET LEVEL UNLOCKED!';setTimeout(()=>go('letter'),850)}else{m.textContent='ACCESS DENIED 😈 Try again, Bb.'}}
function runAway(){let b=document.getElementById('nobtn'),a=document.getElementById('bossarena');if(!b||!a)return;let maxX=Math.max(10,a.clientWidth-b.offsetWidth-20),maxY=Math.max(10,a.clientHeight-b.offsetHeight-20);b.style.left=Math.floor(Math.random()*maxX)+'px';b.style.top=Math.floor(Math.random()*maxY)+'px'}function openGift(){document.getElementById('rewardbox').classList.add('show')}
function go(page){clearInterval(timer);history.pushState({page},'','#'+page);render(page);window.scrollTo(0,0)}function render(page){document.getElementById('app').innerHTML=page==='memories'?memoriesPage():page==='complete'?complete():page==='quiz'?quizPage():page==='secret'?secret():page==='letter'?letter():page==='boss'?boss():page==='reward'?reward():page==='finish'?finish():home();document.getElementById('progressbar').style.width=(progress[page]||5)+'%';if(page==='memories'){slide=0;startSlides()}}window.addEventListener('popstate',()=>render(location.hash.slice(1)||'home'));render(location.hash.slice(1)||'home');
</script></body></html>
