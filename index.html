<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beryl × Jin — Our Love Story</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0824;color:#fff;font-family:Nunito,sans-serif}body{overflow-x:hidden}.screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 15%,#48257d 0,#180d3b 48%,#0d0824 100%);animation:fade .35s ease}.card{width:min(920px,100%);min-height:calc(100vh - 44px);border:4px solid #fff;border-radius:24px;padding:28px;box-shadow:0 0 0 6px #6e3cc9,0 20px 60px #0009;background:#17103a;display:flex;flex-direction:column;justify-content:center;text-align:center}.pixel{font-family:'Press Start 2P',monospace;line-height:1.8}.title{font-size:clamp(26px,6vw,54px);margin:12px 0;color:#ffd7f7;text-shadow:4px 4px #7c3aed}.subtitle{color:#cbbcff;font-weight:700}.players{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:28px 0}.player{padding:18px 24px;border:3px solid #fff;border-radius:16px;background:#241653;min-width:220px}button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:15px 24px;background:#ff5fb7;color:#fff;cursor:pointer;box-shadow:0 5px 0 #9b2e70;margin:6px}button.secondary{background:#5b4bb7;box-shadow:0 5px 0 #372b78}.nav{display:flex;justify-content:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:2px solid #49377e}.timeline{display:grid;gap:12px;margin:26px 0;text-align:left}.memory{padding:16px;border:2px solid #7255bd;border-radius:16px;background:#20164b}.date{font-family:'Press Start 2P';font-size:11px;color:#ffd7f7}.memory h3{margin:8px 0}.completion,.finish{max-width:720px;margin:auto}.emoji{font-size:64px;margin:12px}.letter{font-size:18px;line-height:1.8;text-align:left;background:#21164a;border:2px solid #7255bd;border-radius:18px;padding:22px}.small{font-size:13px;color:#cbbcff;margin-top:20px}.slideshow{position:relative;width:min(650px,100%);margin:24px auto 10px;border:3px solid #fff;border-radius:20px;overflow:hidden;background:#090616;box-shadow:0 0 0 5px #6e3cc9}.slideimg{width:100%;height:min(62vh,620px);object-fit:cover;display:block}.slidefade{animation:fade .35s ease}.slideoverlay{position:absolute;inset:0;background:linear-gradient(transparent 48%,#090616e8 100%);pointer-events:none}.slidebadge{position:absolute;top:14px;left:14px;background:#120a24d9;border:2px solid #fff;border-radius:999px;padding:8px 11px;font-family:'Press Start 2P';font-size:8px}.slidecaption{position:absolute;left:18px;right:18px;bottom:18px;text-align:left}.slidecaption .unlock{font-family:'Press Start 2P';font-size:9px;color:#ffb9df}.slidecaption h2{margin:8px 0 0;font-size:clamp(22px,5vw,34px)}.slidecontrols{display:flex;align-items:center;justify-content:center;gap:10px}.slidecontrols button{font-size:20px;padding:10px 18px}.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px auto;max-width:400px}.dot{width:7px;height:7px;border-radius:50%;background:#675693}.dot.on{background:#ff5fb7;box-shadow:0 0 8px #ff5fb7}.photohelp{font-size:12px;color:#cbbcff;margin:8px auto 18px;max-width:650px}.hidden{display:none!important}@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.card{padding:18px}.slideimg{height:55vh}}</style></head><body><div id="app"></div><script>
const memories=[['03/04','🌱','First time we met'],['08/04','🎬','First private-space movie'],['11/04','🇲🇾','First JB trip'],['12/04','🎬','First JB movie date'],['20/04','🌧️','First drive in the heavy rain + first photo you took of me'],['24/04','🚗','First time picking you up from MBS Zara + our second movie'],['01/05','🎂','First birthday I celebrated for you'],['15/05','🥢','First dim sum supper'],['12/07','🎂🏨','First birthday you celebrated for me + first staycation for my birthday'],['24/07','❤️','Our official date'],['24/08','🎉','Our first monthsary'],['EVERYDAY','🚗','Endless fetching from work to home, school to dates'],['BONUS','🦁','First zoo • Second zoo with my precious godsons • First beach']];
const photos=[['photos/01-airport.jpg','✈️','Where Our Story Began'],['photos/02-dining.jpg','🪞','Little Dates With You'],['photos/03-movie.jpg','🎬','Movie Night'],['photos/04-beach.jpg','🌊','Beach Night ❤️'],['photos/05-shopping.jpg','🛍️','Shopping Together'],['photos/06-food.jpg','🍜','Eat Eat Eat'],['photos/07-drive.jpg','🚗','Late Night Drives'],['photos/08-memory.jpg','💗','Bonus Memory I'],['photos/09-memory.jpg','💗','Bonus Memory II'],['photos/10-memory.jpg','💗','Bonus Memory III'],['photos/11-picnic.jpg','🧺','Picnic Together'],['photos/12-cafe.jpg','☕','Cafe Date'],['photos/13-kiss.jpg','💋','A Little Kiss'],['photos/14-mirror.jpg','🪞','Just Us'],['photos/15-food.jpg','🍽️','Another Food Adventure'],['photos/16-teddies.jpg','🧸','Teddy Bear Memories'],['photos/17-silly.jpg','😂','Silly Us'],['photos/18-mirror.jpg','🪞','Mirror Moments'],['photos/19-city.jpg','🎡','City Nights'],['photos/20-cycling.jpg','🚲','Cycling Adventure']];let slide=0,timer;
function memoryHTML(){return memories.map(m=>`<div class="memory"><div class="date">${m[0]}</div><h3>${m[1]} ${m[2]}</h3></div>`).join('')}
function home(){return `<div class="screen"><main class="card"><div class="pixel">BERYL × JIN</div><div class="title">OUR LOVE STORY ❤️</div><p class="subtitle">PLAYER 1: BERYL　•　PLAYER 2: JIN</p><div class="players"><div class="player">🎮 PLAYER 1<br><strong>BERYL</strong></div><div class="player">💗 PLAYER 2<br><strong>JIN</strong></div></div><button onclick="go('memories')">PRESS START ❤️</button><p class="small">A little arcade game made from our memories.</p></main></div>`}
function memoriesPage(){return `<div class="screen"><main class="card"><div class="pixel">LEVEL 1 — OUR MEMORIES</div><div class="title">MEMORY UNLOCKED ✨</div><p class="subtitle">Collecting our favourite moments, one level at a time.</p><div class="slideshow"><img id="slideimg" class="slideimg" src="${photos[0][0]}" onerror="this.style.opacity='.15'"><div class="slideoverlay"></div><div class="slidebadge" id="slidecount">MEMORY 01 / 20</div><div class="slidecaption"><div class="unlock" id="unlock">${photos[0][1]} MEMORY UNLOCKED</div><h2 id="slidetitle">${photos[0][2]}</h2><b>+1 MEMORY ❤️</b></div></div><div class="slidecontrols"><button class="secondary" onclick="moveSlide(-1)">←</button><button onclick="moveSlide(1)">→</button></div><div class="dots" id="dots">${photos.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('')}</div><p class="photohelp">AUTO PLAY • 4 SEC • 20 MEMORIES</p><div class="timeline">${memoryHTML()}</div><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button onclick="go('complete')">🏆 LEVEL COMPLETE →</button></div></main></div>`}
function updateSlide(){let p=photos[slide],im=document.getElementById('slideimg');if(!im)return;im.classList.remove('slidefade');void im.offsetWidth;im.classList.add('slidefade');im.style.opacity='1';im.src=p[0];document.getElementById('slidecount').textContent=`MEMORY ${String(slide+1).padStart(2,'0')} / 20`;document.getElementById('unlock').textContent=p[1]+' MEMORY UNLOCKED';document.getElementById('slidetitle').textContent=p[2];document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===slide))}function moveSlide(n){slide=(slide+n+photos.length)%photos.length;updateSlide();startSlides()}function startSlides(){clearInterval(timer);timer=setInterval(()=>{slide=(slide+1)%photos.length;updateSlide()},4000)}
function complete(){return `<div class="screen"><main class="card"><div class="completion"><div class="emoji">🏆</div><div class="pixel">LEVEL 1 COMPLETED</div><div class="title">ALL MEMORIES<br>UNLOCKED</div><p class="subtitle">20/20 MEMORIES COLLECTED ❤️</p><p>You made it through our first chapter.</p><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button class="secondary" onclick="go('memories')">🔙 BACK</button><button onclick="go('letter')">💗 CONTINUE →</button></div></div></main></div>`}
function letter(){return `<div class="screen"><main class="card"><div class="pixel">FINAL LEVEL</div><div class="title">💌 A LETTER FROM BERYL</div><div class="letter"><p><strong>Happy 1st Monthsary, Bb ❤️</strong></p><p>These are only some of our firsts. From our first meeting, our little movie dates and JB adventures, to birthdays, staycays, food, beaches, zoo days and all those endless rides from work to home and school to dates — every little moment became part of our story.</p><p>Thank you for all the memories, the laughter and the ordinary days that somehow became special because they were with you.</p><p>And this is only Level 1. I can't wait to collect many, many more memories with you. 🥹❤️</p></div><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button class="secondary" onclick="go('complete')">🔙 BACK</button><button onclick="go('finish')">🏆 FINISH</button></div></main></div>`}
function finish(){return `<div class="screen"><main class="card"><div class="finish"><div class="emoji">💗</div><div class="pixel">ACHIEVEMENT UNLOCKED</div><div class="title">ONE MONTH<br>OF US</div><p class="subtitle">TO BE CONTINUED...</p><p>More food. More movies. More shopping. More adventures. More us. ❤️</p><button onclick="go('home')">🏠 HOME</button></div></main></div>`}function go(page){clearInterval(timer);history.pushState({page},'','#'+page);render(page);window.scrollTo(0,0)}function render(page){document.getElementById('app').innerHTML=page==='memories'?memoriesPage():page==='complete'?complete():page==='letter'?letter():page==='finish'?finish():home();if(page==='memories'){slide=0;startSlides()}}window.addEventListener('popstate',()=>render(location.hash.slice(1)||'home'));render(location.hash.slice(1)||'home');
</script></body></html>
