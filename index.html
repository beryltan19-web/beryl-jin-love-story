<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beryl × Jin — Our Love Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0824;color:#fff;font-family:Nunito,sans-serif}body{overflow-x:hidden}.screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 15%,#48257d 0,#180d3b 48%,#0d0824 100%);animation:fade .35s ease}.card{width:min(920px,100%);min-height:calc(100vh - 44px);border:4px solid #fff;border-radius:24px;padding:28px;box-shadow:0 0 0 6px #6e3cc9,0 20px 60px #0009;background:#17103a;display:flex;flex-direction:column;justify-content:center;text-align:center}.pixel{font-family:'Press Start 2P',monospace;line-height:1.8}.title{font-size:clamp(26px,6vw,54px);margin:12px 0;color:#ffd7f7;text-shadow:4px 4px #7c3aed}.subtitle{color:#cbbcff;font-weight:700}.players{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:28px 0}.player{padding:18px 24px;border:3px solid #fff;border-radius:16px;background:#241653;min-width:220px}button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:15px 24px;background:#ff5fb7;color:#fff;cursor:pointer;box-shadow:0 5px 0 #9b2e70;margin:6px;transition:.15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b2e70}button.secondary{background:#5b4bb7;box-shadow:0 5px 0 #372b78}.nav{display:flex;justify-content:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:2px solid #49377e}.timeline{display:grid;gap:14px;margin:22px 0;text-align:left}.memory{padding:18px;border:2px solid #7255bd;border-radius:16px;background:#20164b}.date{font-family:'Press Start 2P';font-size:11px;color:#ffd7f7}.memory h3{margin:8px 0}.placeholder{height:150px;border-radius:12px;background:linear-gradient(135deg,#39256b,#24164c);display:flex;align-items:center;justify-content:center;color:#bdaef2;margin-top:12px}.completion,.finish{max-width:720px;margin:auto}.emoji{font-size:64px;margin:12px}.letter{font-size:18px;line-height:1.8;text-align:left;background:#21164a;border:2px solid #7255bd;border-radius:18px;padding:22px}.small{font-size:13px;color:#cbbcff;margin-top:20px}.screen.no-scroll{min-height:100vh}.hidden{display:none!important}@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const memories=[
['04/04','🌱','First time we met'],
['08/04','🎬','First private-space movie'],
['11/04','🇲🇾','First JB trip'],
['12/04','🎬','First JB movie date'],
['20/04','🌧️','First drive in the heavy rain + first photo you took of me'],
['24/04','🚗','First time picking you up from MBS Zara + our second movie'],
['01/05','🎂','First birthday I celebrated for you'],
['15/05','🥢','First dim sum supper'],
['12/07','🎂🏨','First birthday you celebrated for me + first staycation for my birthday'],
['24/07','❤️','Our official date'],
['24/08','🎉','Our first monthsary'],
['EVERYDAY','🚗','Endless fetching from work to home, school to dates'],
['BONUS','🦁','First zoo • Second zoo with my precious godsons • First beach']
];
function memoryHTML(){return memories.map(m=>`<div class="memory"><div class="date">${m[0]}</div><h3>${m[1]} ${m[2]}</h3><div class="placeholder">📸 PHOTO PLACEHOLDER</div></div>`).join('')}
function home(){return `<div class="screen"><main class="card"><div class="pixel">BERYL × JIN</div><div class="title">OUR LOVE STORY ❤️</div><p class="subtitle">PLAYER 1: BERYL　•　PLAYER 2: JIN</p><div class="players"><div class="player">🎮 PLAYER 1<br><strong>BERYL</strong></div><div class="player">💗 PLAYER 2<br><strong>JIN</strong></div></div><button onclick="go('memories')">PRESS START ❤️</button><p class="small">A little arcade game made from our memories.</p></main></div>`}
function memoriesPage(){return `<div class="screen"><main class="card"><div class="pixel">LEVEL 1 — OUR MEMORIES</div><p class="subtitle">Every little first became part of us.</p><div class="timeline">${memoryHTML()}</div><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button onclick="go('complete')">🏆 LEVEL COMPLETE →</button></div></main></div>`}
function complete(){return `<div class="screen"><main class="card"><div class="completion"><div class="emoji">🏆</div><div class="pixel">LEVEL 1 COMPLETED</div><div class="title">ALL MEMORIES<br>UNLOCKED</div><p class="subtitle">BERYL ❤️ JIN</p><p>You made it through our first chapter.</p><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button class="secondary" onclick="go('memories')">🔙 BACK</button><button onclick="go('letter')">💗 CONTINUE →</button></div></div></main></div>`}
function letter(){return `<div class="screen"><main class="card"><div class="pixel">FINAL LEVEL</div><div class="title">💌 A LETTER FROM BERYL</div><div class="letter"><p><strong>Happy 1st Monthsary, Bb ❤️</strong></p><p>These are only some of our firsts. From our first meeting, our little movie dates and JB adventures, to birthdays, staycays, food, beaches, zoo days and all those endless rides from work to home and school to dates — every little moment became part of our story.</p><p>Thank you for all the memories, the laughter and the ordinary days that somehow became special because they were with you.</p><p>And this is only Level 1. I can't wait to collect many, many more memories with you. 🥹❤️</p></div><div class="nav"><button class="secondary" onclick="go('home')">🏠 HOME</button><button class="secondary" onclick="go('complete')">🔙 BACK</button><button onclick="go('finish')">🏆 FINISH</button></div></main></div>`}
function finish(){return `<div class="screen"><main class="card"><div class="finish"><div class="emoji">💗</div><div class="pixel">ACHIEVEMENT UNLOCKED</div><div class="title">ONE MONTH<br>OF US</div><p class="subtitle">TO BE CONTINUED...</p><p>More food. More movies. More shopping. More adventures. More us. ❤️</p><button onclick="go('home')">🏠 HOME</button></div></main></div>`}
function go(page){history.pushState({page},'', '#'+page);render(page);window.scrollTo(0,0)}
function render(page){document.getElementById('app').innerHTML=page==='memories'?memoriesPage():page==='complete'?complete():page==='letter'?letter():page==='finish'?finish():home()}
window.addEventListener('popstate',()=>render(location.hash.slice(1)||'home'));
render(location.hash.slice(1)||'home');
</script>
</body>
</html>
